name: Daily news

on:
  schedule:
    - cron: "0 21 * * *"   # 每天 21:00 UTC(台灣早上 5 點)
  workflow_dispatch:        # 也可以在網頁上手動按「Run workflow」= 換一篇

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python news_web.py
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
      - name: Commit result
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs
          git commit -m "Update article" || echo "nothing to commit"
          git push
