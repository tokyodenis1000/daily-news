<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Daily News</title>
<style>
:root{--bg:#1e1e2e;--panel:#2a2a3c;--fg:#e6e6e6;--accent:#7aa2f7;--zh:#8fa1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid #333;z-index:5}
#meta{color:var(--accent);font-size:13px;font-weight:bold;margin-bottom:8px}
.bar button{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px 12px;margin-right:6px;font-size:14px}
main{padding:14px;max-width:760px;margin:auto;font-size:var(--fs,18px)}
h1{font-size:1.35em;margin:.2em 0}
.en{margin:0 0 .4em}
.zh{color:var(--zh);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.93em;margin:0 0 1.4em}
.hide-zh .zh{display:none}
.w{border-radius:3px}
.w:active{background:#3b4261}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:14px 16px 20px;
 border-top:2px solid var(--accent);transform:translateY(110%);transition:.2s;z-index:10}
#sheet.open{transform:none}
#sheet b{font-size:20px}
#sheet a{color:var(--accent);margin-right:14px}
#tr{margin:6px 0 10px;min-height:1.4em;color:#cfd6f5}
</style></head>
<body>
<header><div id="meta"></div>
<div class="bar"><button id="bz">中文 顯示/隱藏</button><button id="bm">A−</button><button id="bp">A+</button>
<button id="bo">原文</button></div></header>
<main id="main"></main>
<div id="sheet"><b id="word"></b><div id="tr"></div>
<a id="cam" target="_blank">劍橋字典</a><a id="gt" target="_blank">Google 翻譯</a><a href="#" id="close">關閉</a></div>
<script>
const A = {"source": "VOA News", "title": "US says Taliban failing to combat human trafficking in Afghanistan", "link": "https://www.voanews.com/a/us-says-taliban-failing-to-combat-human-trafficking-in-afghanistan/8209667.html", "paras": ["Editor's note: this story was translated from the original VOA Dari article.", "The United States says the Taliban government in Afghanistan does not ‘fully’ meet the minimum standards for combating human trafficking and is not making significant efforts to do so.", "In the U.S. State Department’s 2026 Trafficking in Persons Report, released on Thursday, Taliban-ruled Afghanistan remained in Tier 3.", "During the reporting period, from April 2025 to March 2026, “... there was a pattern of recruitment and use of child soldiers in combat and support roles and a pattern of sexual slavery (bacha bazi — a practice in which men exploit boys for social and sexual entertainment),” the report said.", "Tier 3 refers to countries where government agencies and other public sector institutions do not fully comply with the minimum criteria for combating human trafficking and do not make significant efforts to improve the situation.", "The report listed 20 countries, including Afghanistan, Iran, Russia, Cuba, Venezuela, Sudan and South Sudan, in Tier 3.", "The State Department said the Taliban did not take any steps to address the problem of trafficking.", "“The Taliban did not report any investigation, prosecutions, or convictions, nor did it identify or protect any trafficking victims,\" the report said.", "In July, the United Nations Office on Drugs and Crime and the International Organization for Migration called for coordination of efforts to prevent trafficking and assist victims.", "“Victims continue to be pushed into unsafe work, forced labor, sexual exploitation, slavery-like conditions, or even have their organs removed against their will. Women, children, returnees, and indebted households remain at heightened risk,” said UNODC and IOM in a joint statement.", "The U.S. State Department noted that referring to the Taliban in the report does not mean recognition of the Taliban as the Afghan government.", "According to the report, the Taliban and other armed groups employ children illegally and use them in war and to perform support duties, the report said.", "“The Taliban recruit children through coercion and fraud, including from schools in Afghanistan and Pakistan, enrolling them in jihadi madrassas that reportedly provide military training,” the report said.", "In addition to the Taliban, groups such as the Islamic State Khorasan, also called ISIS-K, and the National Resistance Front, an anti-Taliban armed group, also use children in the fighting.", "Although the Taliban have issued a decree banning human trafficking, the report noted that it “did not provide a clear definition of human trafficking or penalties that were sufficiently stringent. The new edict also included provisions that recognized aspects of slavery.”"], "words": 420, "zh": ["美國指稱塔利班未能在阿富汗打擊人口販運", "編者註：本文翻譯自美國之音（VOA）達里語原文報導。", "美國表示，阿富汗的塔利班政府並未「完全」達到打擊人口販運的最低標準，且未就此作出實質性努力。", "在美國國務院週四發布的《2026年人口販運報告》中，由塔利班統治的阿富汗仍被列為第三級。", "報告指出，在2025年4月至2026年3月的報告期間內，「……存在招募及使用童兵擔任作戰與支援職務的模式，以及性奴役（bacha bazi——一種男性利用男孩進行社交及性娛樂的行為）的模式。」", "第三級是指政府機關及其他公共部門機構未能完全符合打擊人口販運的最低標準，且未採取實質性措施以改善現狀的國家。", "該報告將包括阿富汗、伊朗、俄羅斯、古巴、委內瑞拉、蘇丹和南蘇丹在內的 20 個國家列為第三級。", "美國國務院表示，塔利班並未採取任何措施來解決人口販運問題。", "報告指出：「塔利班既未通報任何調查、起訴或定罪，也未識別或保護任何人口販運受害者。」", "七月，聯合國毒品和犯罪問題辦公室與國際移民組織呼籲協調各方努力，以防止人口販運並協助受害者。", "「受害者持續被迫從事不安全的工作、遭受強迫勞動、性剝削、處於類似奴隸的處境，甚至在非自願的情況下被摘取器官。婦女、兒童、返鄉者及負債家庭仍面臨極高風險，」聯合國毒品和犯罪問題辦公室（UNODC）與國際移民組織（IOM）在聯合聲明中表示。", "美國國務院指出，報告中提及塔利班，並不意味著承認塔利班為阿富汗政府。", "該報告指出，塔利班及其他武裝團體非法徵用兒童，並將其用於戰爭及執行後勤支援任務。", "報告指出：「塔利班透過脅迫和欺詐手段招募兒童，包括從阿富汗和巴基斯坦的學校中招募，並將他們送入據稱提供軍事訓練的聖戰宗教學校。」", "除了塔利班之外，諸如「伊斯蘭國呼羅珊省」（亦稱ISIS-K）以及反塔利班武裝組織「全國抵抗陣線」等團體，同樣在戰鬥中徵用兒童。", "儘管塔利班已頒布一項禁止人口販運的法令，但該報告指出，該法令「既未對人口販運提供明確的定義，也未規定足夠嚴厲的處罰。這項新法令中還包含一些承認奴隸制某些方面的條款。」"], "zh_for": "https://www.voanews.com/a/us-says-taliban-failing-to-combat-human-trafficking-in-afghanistan/8209667.html", "date": "2026-10-12"};
const main = document.getElementById('main');
document.getElementById('meta').textContent = A.date + ' | ' + A.source + ' | ' + A.paras.length + ' 段 · 約 ' + A.words + ' 字';
function wrap(t){ return t.replace(/[A-Za-z][A-Za-z'’-]*/g, m => '<span class="w">'+m+'</span>'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let h = '<h1>'+wrap(esc(A.title))+'</h1><p class="zh">'+esc(A.zh[0]||'')+'</p>';
A.paras.forEach((p,i)=>{ h += '<p class="en">'+wrap(esc(p))+'</p><p class="zh">'+esc(A.zh[i+1]||'')+'</p>'; });
main.innerHTML = h;
let fs = +localStorage.fs || 18; const setFs=()=>{main.style.setProperty('--fs',fs+'px');localStorage.fs=fs};
setFs();
if(localStorage.hz==='1') main.classList.add('hide-zh');
bz.onclick=()=>{main.classList.toggle('hide-zh');localStorage.hz=main.classList.contains('hide-zh')?'1':'0'};
bm.onclick=()=>{fs=Math.max(13,fs-1);setFs()}; bp.onclick=()=>{fs=Math.min(30,fs+1);setFs()};
bo.onclick=()=>window.open(A.link,'_blank');
const sheet=document.getElementById('sheet');
close.onclick=e=>{e.preventDefault();sheet.classList.remove('open')};
main.addEventListener('click', async e=>{
  const el=e.target.closest('.w'); if(!el) return;
  const w=el.textContent.replace(/[’]/g,"'"); const lw=w.toLowerCase();
  word.textContent=w; tr.textContent='查詢中…';
  cam.href='https://dictionary.cambridge.org/dictionary/english-chinese-traditional/'+encodeURIComponent(lw);
  gt.href='https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text='+encodeURIComponent(w);
  sheet.classList.add('open');
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(lw)+'&langpair=en|zh-TW');
    const j=await r.json(); tr.textContent=(j.responseData&&j.responseData.translatedText)||'(查不到,請點劍橋字典)';
  }catch(_){ tr.textContent='(查詢失敗,請點劍橋字典)'; }
});
</script></body></html>
