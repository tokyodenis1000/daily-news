<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Daily News</title>
<style>
:root{--bg:#1e1e2e;--panel:#2a2a3c;--fg:#e6e6e6;--accent:#7aa2f7;--zh:#8fa1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid #333;z-index:5}
#meta{color:var(--accent);font-size:13px;font-weight:bold;margin-bottom:8px}
.bar button{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px 12px;margin-right:6px;font-size:14px}
main{padding:14px;max-width:760px;margin:auto;font-size:var(--fs,18px)}
h1{font-size:1.35em;margin:.2em 0}
.en{margin:0 0 .4em}
.zh{color:var(--zh);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.93em;margin:0 0 1.4em}
.hide-zh .zh{display:none}
.w{border-radius:3px}
.pl{background:var(--panel);color:var(--accent);border:0;border-radius:50%;width:1.7em;height:1.7em;margin-right:.5em;font-size:.8em;vertical-align:middle}
.playing{background:#2f3350;border-radius:6px}
.bar select{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px;font-size:14px}
.w:active{background:#3b4261}
.w.sv{background:#3b4261;text-decoration:underline}
#sv{background:var(--accent);color:#000;border:0;border-radius:6px;padding:8px 12px;margin:0 10px 10px 0;font-size:14px}
#vp{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px;display:none}
#vp.open{display:block}
#vp .bar{margin-bottom:12px}
.vi{background:var(--panel);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:16px}
.vi b{color:var(--accent);font-size:1.1em}
.vi small{display:block;color:#9aa5ce;margin-top:4px;font-size:13px}
.vi .del{float:right;background:#3b4261;color:var(--fg);border:0;border-radius:6px;padding:4px 8px}
#qz{text-align:center;padding-top:30px}
#qn{color:var(--accent);font-weight:bold}
#qw{font-size:34px;font-weight:bold;margin:24px 0 8px}
#qa{font-size:22px;color:#c0caf5;min-height:1.4em;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
#qs{color:#9aa5ce;margin:14px 0 24px;min-height:3em}
#qb{background:var(--panel);color:var(--fg);border:0;border-radius:8px;padding:12px 28px;font-size:17px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:14px 16px 20px;
 border-top:2px solid var(--accent);transform:translateY(110%);transition:.2s;z-index:10}
#sheet.open{transform:none}
#sheet b{font-size:20px}
#sheet a{color:var(--accent);margin-right:14px}
#tr{margin:6px 0 10px;min-height:1.4em;color:#cfd6f5}
</style></head>
<body>
<header><div id="meta"></div>
<div class="bar"><button id="bz">中文 顯示/隱藏</button><button id="bm">A−</button><button id="bp">A+</button>
<button id="bo">原文</button><button id="bv">★ 生字本</button>
<button id="ba">▶ 全文朗讀</button><select id="rate"><option value="0.7">慢</option><option value="0.85" selected>中</option><option value="1">正常</option></select></div></header>
<main id="main"></main>
<div id="sheet"><b id="word"></b> <button class="pl" id="sp">🔊</button><div id="tr"></div>
<button id="sv">★ 加入生字本</button>
<a id="cam" target="_blank">劍橋字典</a><a id="gt" target="_blank">Google 翻譯</a><a href="#" id="cl">關閉</a></div>
<div id="vp"><div class="bar"><button id="vx">← 返回文章</button><button id="vq">開始測驗</button><button id="ve">匯出 CSV</button></div>
<div id="vl"></div>
<div id="qz"><div id="qn"></div><div id="qw"></div><div id="qa"></div><div id="qs"></div><button id="qb">顯示答案</button></div></div>
<script>
const A = {"source": "VOA News", "title": "NGO tells VOA millions of Ukrainian children affected by deportation, occupation and displacement abroad since start of Russia war", "link": "https://www.voanews.com/a/8211956.html", "paras": ["Ukraine has seen its child population decline by millions since Moscow launched its war on Ukraine in 2014, due to deportation, occupation, displacement abroad and direct war casualties, Mykola Kuleba, founder and head of Save Ukraine, told VOA.", "Kuleba's NGO, Save Ukraine, rescues children from Russia and Russian-controlled territories.", "Russia’s full-scale invasion that began in 2022 triggered the largest displacement crisis in Europe since World War II. Although many Ukrainians have returned home, more than five million remain abroad, according to UNHCR, most of them in Europe, many of them children.", "An estimated 1.5 million Ukrainian children remain in territories under Russian control.", "According to Ukraine`s Children of War portal, as of October 16, 2026, Ukrainian authorities have recorded 20,651 children as deported or forcibly displaced and 2,689 as returned. These figures reflect documented cases, not necessarily the full number of children affected. Also, as of mid-October, 762 children have been killed and 2,952 injured in the war, while 2,362 remain missing, according to Ukrainian authorities.", "Ukrainian children under Russian control are subjected to indoctrination and militarization aimed at molding them into future Russian soldiers, Kuleba says, which includes those forcibly transferred to Russia.", "Russian officials claim that Russia is not stealing Ukrainian children but saving them.", "However, Article 78 of Additional Protocol I to the Geneva Conventions sets strict conditions for evacuating children to a foreign country during an armed conflict. Such evacuations must be temporary and justified by compelling reasons related to the children’s safety, health or medical needs, and require the written consent of their parents, legal guardians or other persons responsible for their care. The article also requires the authorities arranging the evacuation and where appropriate, the receiving country’s authorities, to create an individual record for each child and send it to the International Committee of the Red Cross to help facilitate the child’s return to their family and country.", "In March, the U.N. Independent International Commission of Inquiry on Ukraine concluded that Russian authorities committed “the crimes against humanity of deportation and forcible transfer, as well as of enforced disappearance of children.”", "The commission found that the actions were a part of a policy conceived at the highest level and systematically executed. Only 20 percent of the children in the cases of forcible transfer investigated by the commission have been returned.", "Through missions whose operational details it keeps confidential, Save Ukraine says it has rescued more than 1,800 children, according to the organization’s website. Its work forms a part of a broader effort coordinated by Ukraine president’s initiative Bring Kids Back UA, which also includes the International Coalition for the Return of Ukrainian Children with 52 members – countries and international organizations – five other Ukrainian NGOs, and the Ukrainian Parliament Commissioner for Human Rights.", "The efforts of U.S. First Lady Melania Trump have also helped to reunite 34 children with their families, according to an August 17 White House statement.", "“When Moscow completely denies the abductions and refuses to return the children, the efforts of the first lady of the United States are very helpful in bringing these children home,” Kuleba told VOA in a recent interview.", "He said that every passing day makes the return of children more difficult.", "“Russian propaganda shapes the information environment in which people live and often turns families and children into adherents of the Russian Empire. They begin to fear Ukraine and believe that there are supposedly Nazis in Ukraine, and that the West has joined forces with the Nazis to destroy Russia,” he said.", "Children are also subjected to military training intended to prepare them for future combat, Kuleba said.", "A 2025 investigation by Yale Humanitarian Research Lab, identified at least 210 facilities in Russia and occupied Ukrainian territory to which children from Ukraine had been taken. The researchers found evidence of militarization in at least 18 percent of these facilities.", "“Children who return tell us that Russian military personnel come to their schools to teach them how to handle weapons and provide tactical medical training,\" the children's activist said. \"Starting at around age 14, many are taken to the military camps in Russia, where three-week programs teach them how to throw grenades and blow up tanks. One 15-year-old girl who was taken to one of these camps showed me how to set up a tripwire with a grenade. She also described how other children practiced parachuting. They are genuinely being prepared for combat.”", "Some children that Save Ukraine was trying to bring back have been sent to the frontlines and even died, Kuleba told VOA. He warned that Russia`s policies pose a threat beyond Ukraine because children are being raised to hate not only Ukraine but also the United States and other Western countries.", "After children return, Save Ukraine helps them reintegrate into Ukrainian society. The organization operates rehabilitation centers across Ukraine, with a reported capacity of 800 beds."], "words": 813, "zh": ["非政府組織向美國之音表示，自俄羅斯發動戰爭以來，數百萬烏克蘭兒童受到驅逐、佔領及流離失所等影響", "「拯救烏克蘭」（Save Ukraine）組織創辦人兼負責人尼古拉·庫列巴（Mykola Kuleba）向美國之音（VOA）表示，自2014年莫斯科對烏發動戰爭以來，由於強制驅逐、佔領、流離失所至海外以及直接戰爭傷亡等因素，烏克蘭的兒童人口已減少數百萬。", "庫列巴所屬的非政府組織「拯救烏克蘭」致力於從俄羅斯及俄羅斯控制的地區營救兒童。", "俄羅斯自2022年發動的大規模入侵，引發了二戰以來歐洲最嚴重的流離失所危機。儘管許多烏克蘭人已返回家園，但根據聯合國難民署（UNHCR）的數據，仍有超過五百萬人滯留海外，其中大部分身處歐洲，且許多是兒童。", "據估計，仍有約150萬名烏克蘭兒童滯留在俄羅斯控制的地區。", "根據烏克蘭「戰爭中的兒童」網站的資料，截至 2026 年 10 月 16 日，烏克蘭當局已記錄有 20,651 名兒童遭驅逐或被迫流離失所，另有 2,689 名兒童已返家。這些數字反映的是經記錄的個案，未必代表受影響兒童的總數。 此外，根據烏克蘭當局資料，截至10月中旬，已有762名兒童在戰爭中喪生、2,952名受傷，另有2,362名兒童下落不明。", "庫列巴表示，處於俄羅斯控制下的烏克蘭兒童正遭受意識形態灌輸和軍事化訓練，旨在將他們塑造成未來的俄羅斯士兵，其中包括那些被強行轉移至俄羅斯的兒童。", "俄羅斯官員聲稱，俄羅斯並非在綁架烏克蘭兒童，而是正在拯救他們。", "然而，《日內瓦公約第一附加議定書》第78條針對武裝衝突期間將兒童撤離至外國一事，訂定了嚴格的條件。此類撤離必須屬臨時性質，且須基於與兒童安全、健康或醫療需求相關的充分理由，並須獲得其父母、法定監護人或其他負責照顧該兒童之人士的書面同意。 該條文亦規定，負責安排撤離的當局，以及在適當情況下，接收國的當局，須為每名兒童建立個別檔案，並將其送交紅十字國際委員會，以協助促進兒童返回其家庭及祖國。", "今年3月，聯合國烏克蘭問題獨立國際調查委員會得出結論，指俄羅斯當局犯下了「驅逐和強迫遷移等危害人類罪，以及兒童強迫失蹤罪」。", "該委員會發現，這些行為是最高層所擬定並有系統地執行的政策的一部分。在該委員會調查的強制遷移案件中，僅有百分之二十的兒童得以返家。", "根據該組織網站的資料，「拯救烏克蘭」表示，透過其行動細節保密的多項任務，已成功營救超過 1,800 名兒童。 該組織的工作是烏克蘭總統發起的「Bring Kids Back UA」倡議所協調的更廣泛行動的一部分，該倡議還包括擁有52個成員（包括國家及國際組織）的「烏克蘭兒童返鄉國際聯盟」、另外五個烏克蘭非政府組織，以及烏克蘭議會人權專員。", "根據白宮8月17日發表的聲明，美國第一夫人梅拉尼婭·川普的努力也協助34名兒童與家人團聚。", "「當莫斯科完全否認綁架事件並拒絕歸還這些兒童時，美國第一夫人的努力對於讓這些孩子回家起到了很大的幫助，」庫列巴在最近接受美國之音採訪時表示。", "他表示，隨著每一天的過去，讓孩子們平安歸來變得越來越困難。", "「俄羅斯的宣傳塑造了人們所處的資訊環境，並經常將家庭和兒童轉變為俄羅斯帝國的追隨者。他們開始恐懼烏克蘭，並相信烏克蘭境內據稱有納粹分子，而且西方已與納粹聯手以摧毀俄羅斯，」他表示。", "庫列巴表示，兒童還被迫接受旨在為未來作戰做準備的軍事訓練。", "耶魯大學人道主義研究實驗室於2025年進行的一項調查指出，在俄羅斯及被佔領的烏克蘭領土上，至少有210處設施曾收容來自烏克蘭的兒童。研究人員發現，其中至少18％的設施存在軍事化的跡象。", "「返回的孩童告訴我們，俄羅斯軍方人員會來到他們的學校，教導他們如何操作武器，並提供戰術醫療訓練，」這位兒童權益倡議者表示。「從大約14歲開始，許多孩子就被帶往俄羅斯的軍事營地，在那裡接受為期三週的訓練，學習如何投擲手榴彈和炸毀坦克。 一名曾被帶往其中一個營地的15歲女孩向我示範了如何用手榴彈設置觸發線。她還描述了其他孩子如何練習跳傘。他們確實正在接受實戰訓練。」", "庫列巴向美國之音表示，「拯救烏克蘭」組織原本試圖接回的部分兒童，已被送往前線，甚至有人因此喪生。他警告說，俄羅斯的政策所構成的威脅不僅限於烏克蘭，因為這些兒童被教導不僅要憎恨烏克蘭，還要憎恨美國及其他西方國家。", "在兒童返回後，「拯救烏克蘭」組織協助他們重新融入烏克蘭社會。該組織在烏克蘭各地營運康復中心，據報共設有 800 張病床。"], "zh_for": "https://www.voanews.com/a/8211956.html", "date": "2026-10-17"};
const main = document.getElementById('main');
document.getElementById('meta').textContent = A.date + ' | ' + A.source + ' | ' + A.paras.length + ' 段 · 約 ' + A.words + ' 字';
function wrap(t){ return t.replace(/[A-Za-z][A-Za-z'’-]*/g, m => '<span class="w">'+m+'</span>'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let h = '<h1>'+wrap(esc(A.title))+'</h1><p class="zh">'+esc(A.zh[0]||'')+'</p>';
A.paras.forEach((p,i)=>{ h += '<p class="en" id="p'+i+'"><button class="pl" data-i="'+i+'">▶</button>'+wrap(esc(p))+'</p><p class="zh">'+esc(A.zh[i+1]||'')+'</p>'; });
main.innerHTML = h;
let fs = +localStorage.fs || 18; const setFs=()=>{main.style.setProperty('--fs',fs+'px');localStorage.fs=fs};
setFs();
if(localStorage.hz==='1') main.classList.add('hide-zh');
bz.onclick=()=>{main.classList.toggle('hide-zh');localStorage.hz=main.classList.contains('hide-zh')?'1':'0'};
bm.onclick=()=>{fs=Math.max(13,fs-1);setFs()}; bp.onclick=()=>{fs=Math.min(30,fs+1);setFs()};
bo.onclick=()=>window.open(A.link,'_blank');
// ---- 朗讀(用手機內建的語音,不需要網路與金鑰)----
const synth = window.speechSynthesis; let voice=null, playing=false, token=0;
function pickVoice(){ const v=(synth&&synth.getVoices())||[]; voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|natural|enhanced/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function say(text,done){ if(!synth){alert('這個瀏覽器不支援朗讀');return;} const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=+document.getElementById('rate').value; u.onend=done||null; u.onerror=done||null; synth.speak(u); }
function stopAll(){ token++; playing=false; if(synth) synth.cancel(); ba.textContent='▶ 全文朗讀'; document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); }
function playFrom(i){ stopAll(); const my=token; playing=true; ba.textContent='⏹ 停止';
  (function next(k){ if(my!==token||k>=A.paras.length){ if(my===token) stopAll(); return; }
    const el=document.getElementById('p'+k); document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'});
    say(A.paras[k],()=>{ if(my===token) next(k+1); }); })(i); }
ba.onclick=()=>{ playing?stopAll():playFrom(0); };
main.addEventListener('click',e=>{ const b=e.target.closest('.pl'); if(b){ playFrom(+b.dataset.i); } });
document.getElementById('sp').onclick=()=>{ stopAll(); say(word.textContent); };
window.addEventListener('pagehide',stopAll);
// ---- 生字本(存在這支手機的瀏覽器裡;清除瀏覽器資料會一起消失,可先匯出 CSV 備份)----
let V=[]; try{V=JSON.parse(localStorage.vocab||'[]')}catch(_){V=[]}
const saveV=()=>{try{localStorage.vocab=JSON.stringify(V)}catch(_){}};
const hasV=w=>V.some(v=>v.word.toLowerCase()===w.toLowerCase());
function markV(){ const s=new Set(V.map(v=>v.word.toLowerCase())); document.querySelectorAll('.w').forEach(e=>e.classList.toggle('sv',s.has(e.textContent.replace(/[’]/g,"'").toLowerCase()))); }
function sentenceOf(el){ const p=el.closest('p,h1'); if(!p) return ''; const t=p.textContent.replace(/^▶/,'').trim(); for(const s of t.split(/(?<=[.!?])\s+/)){ if(s.includes(el.textContent)) return s.trim(); } return t; }
let cur=null;
markV();
sv.onclick=()=>{ if(!cur||hasV(cur.word)) return; V.push({word:cur.word,zh:cur.zh||'',sentence:cur.sentence,source:A.source,title:A.title,date:A.date}); saveV(); markV(); sv.textContent='已加入 ✓'; };
function renderV(){ qz.style.display='none'; vl.style.display='block';
  vl.innerHTML=V.length?V.slice().reverse().map(v=>'<div class="vi"><button class="del" data-w="'+esc(v.word)+'">刪除</button><b>'+esc(v.word)+'</b> '+esc(v.zh||'')+'<small>'+esc(v.sentence||'')+'</small></div>').join(''):'<p>還沒有生字。點文章裡的單字,再按「★ 加入生字本」。</p>'; }
vl.addEventListener('click',e=>{ const b=e.target.closest('.del'); if(!b) return; V=V.filter(v=>v.word!==b.dataset.w); saveV(); markV(); renderV(); });
bv.onclick=()=>{ stopAll(); renderV(); vp.classList.add('open'); };
vx.onclick=()=>vp.classList.remove('open');
let Q=[],qi=0,qshown=false;
function qrender(){ qshown=false; qn.textContent=(qi+1)+'/'+Q.length; qw.textContent=Q[qi].word; qa.textContent=''; qs.textContent=''; qb.textContent='顯示答案'; }
vq.onclick=()=>{ if(!V.length) return; Q=V.slice().sort(()=>Math.random()-.5); qi=0; vl.style.display='none'; qz.style.display='block'; qrender(); };
qb.onclick=()=>{
  if(qi>=Q.length){ renderV(); return; }
  if(!qshown){ qa.textContent=Q[qi].zh||'(沒有翻譯)'; qs.textContent=Q[qi].sentence||''; qshown=true; qb.textContent=qi+1<Q.length?'下一個':'完成'; }
  else if(qi+1<Q.length){ qi++; qrender(); }
  else { qi=Q.length; qn.textContent='完成!'; qw.textContent='複習完了'; qa.textContent=''; qs.textContent=''; qb.textContent='回到清單'; }
};
ve.onclick=()=>{ const rows=[['單字','中文','例句','文章來源','文章標題','日期']].concat(V.map(v=>[v.word,v.zh,v.sentence,v.source,v.title,v.date]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='vocab.csv'; a.click(); };

const sheet=document.getElementById('sheet');
document.getElementById('cl').onclick=e=>{e.preventDefault();sheet.classList.remove('open')};
main.addEventListener('click', async e=>{
  const el=e.target.closest('.w'); if(!el) return;
  const w=el.textContent.replace(/[’]/g,"'"); const lw=w.toLowerCase();
  word.textContent=w; tr.textContent='查詢中…';
cur={word:w,zh:'',sentence:sentenceOf(el)}; sv.textContent=hasV(w)?'已加入 ✓':'★ 加入生字本';
  cam.href='https://dictionary.cambridge.org/dictionary/english-chinese-traditional/'+encodeURIComponent(lw);
  gt.href='https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text='+encodeURIComponent(w);
  sheet.classList.add('open');
