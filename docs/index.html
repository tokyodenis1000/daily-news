<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Daily News</title>
<style>
:root{--bg:#1e1e2e;--panel:#2a2a3c;--fg:#e6e6e6;--accent:#7aa2f7;--zh:#8fa1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid #333;z-index:5}
#meta{color:var(--accent);font-size:13px;font-weight:bold;margin-bottom:8px}
.bar button{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px 12px;margin-right:6px;font-size:14px}
main{padding:14px;max-width:760px;margin:auto;font-size:var(--fs,18px)}
h1{font-size:1.35em;margin:.2em 0}
.en{margin:0 0 .4em}
.zh{color:var(--zh);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.93em;margin:0 0 1.4em}
.hide-zh .zh{display:none}
.w{border-radius:3px}
.pl{background:var(--panel);color:var(--accent);border:0;border-radius:50%;width:1.7em;height:1.7em;margin-right:.5em;font-size:.8em;vertical-align:middle}
.playing{background:#2f3350;border-radius:6px}
.bar select{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px;font-size:14px}
.w:active{background:#3b4261}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:14px 16px 20px;
 border-top:2px solid var(--accent);transform:translateY(110%);transition:.2s;z-index:10}
#sheet.open{transform:none}
#sheet b{font-size:20px}
#sheet a{color:var(--accent);margin-right:14px}
#tr{margin:6px 0 10px;min-height:1.4em;color:#cfd6f5}
</style></head>
<body>
<header><div id="meta"></div>
<div class="bar"><button id="bz">中文 顯示/隱藏</button><button id="bm">A−</button><button id="bp">A+</button>
<button id="bo">原文</button>
<button id="ba">▶ 全文朗讀</button><select id="rate"><option value="0.7">慢</option><option value="0.85" selected>中</option><option value="1">正常</option></select></div></header>
<main id="main"></main>
<div id="sheet"><b id="word"></b> <button class="pl" id="sp">🔊</button><div id="tr"></div>
<a id="cam" target="_blank">劍橋字典</a><a id="gt" target="_blank">Google 翻譯</a><a href="#" id="cl">關閉</a></div>
<script>
const A = {"source": "VOA News", "title": "Human Rights Group: Repression Intensifies in Russia for Participation in ‘Undesirable Organizations’", "link": "https://www.voanews.com/a/human-rights-group-repression-intensifies-in-russia-for-participation-in-undesirable-organizations/8209652.html", "paras": ["Editor's note: this story was translated from the original VOA Russian article.", "The number of politically motivated prosecutions in Russia involving restrictions on freedom of association increased by 50% in the first nine months of 2026, according to a new report by the Support for Political Prisoners Memorial Center.", "The human rights group was part of the Memorial Human Rights Center that was liquidated by a Russian Court in 2022. Operating as the Support for Political Prisoners Memorial center, the group continues to work independently to help political prisoners in Russia.", "According to the new report, the number of people charged in politically motivated criminal cases rose to 328 from 219. Those targeted are primarily supporters of late opposition leader Alexei Navalny, “USSR citizens,” Jehovah’s Witnesses, and members of organizations designated as “undesirable.”", "Meanwhile, the number of prosecutions linked to Navalny’s organizations increased by 107% over the year, from 69 to 143 people. The number of people accused of financing an extremist organization rose by nearly 117%, from 77 to 167.", "Human rights activist Anna Karetnikova points out that one of the main trends in recent months has been a change in the nature of political repression.", "Whereas a significant proportion of criminal cases previously involved public statements, including those made online, she says law enforcement authorities now are increasingly targeting people for actions that the authorities interpret as support for or participation in “banned” organizations.", "“The focus is shifting to people who do not openly protest but express their disagreement in various ways or support the side they believe is right in the conflict,” Karetnikova told VOA’s Russian service.", "According to Karetnikova, such activities may include running chat groups, providing materials for publication, or financially supporting organizations.", "The Support for Political Prisoners Memorial Center report said the number of cases involving money transfers to the Navalny-founded Anti-Corruption Foundation (FBK), which Russian authorities have designated an “extremist organization,” has risen particularly sharply.", "At the same time, the overall number of cases related to persecution for public statements fell by 22% over the year. There was an increase in other types of cases, however, such as in the number of cases involving calls for extremism. Those rose by 26%, while cases brought under articles concerning crimes against state security increased by 13%.", "According to Karetnikova, people who were not previously considered political activists are increasingly becoming targets of criminal prosecution. She attributes this to the fact that, as the best-known opponents of the Russian authorities are imprisoned or leave the country, the repressive apparatus begins to expand the pool of potential targets.", "“This includes tractor drivers, teachers, rural doctors — anyone,” Karetnikova said.", "The report’s authors also note a significant increase in the role of the Federal Security Service (FSB) in political prosecutions. In 67% of politically motivated criminal cases, at least one charge falls under the FSB’s investigative jurisdiction."], "words": 479, "zh": ["人權組織：俄羅斯針對參與「不受歡迎組織」的打壓日趨嚴厲", "編者註：本報導翻譯自美國之音（VOA）俄語原文。", "根據「支持政治犯紀念中心」最新發布的一份報告，2026年前九個月，俄羅斯因限制結社自由而引發的政治動機起訴案件數量增加了50%。", "該人權團體原隸屬於「紀念人權中心」，該中心於2022年遭俄羅斯法院裁定解散。該團體現以「支持政治犯紀念中心」之名運作，並持續獨立運作，致力於協助俄羅斯境內的政治犯。", "根據這份新報告，因政治動機而被起訴的刑事案件人數從 219 人上升至 328 人。受針對的對象主要是已故反對派領袖阿列克謝·納瓦爾尼的支持者、「蘇聯公民」、耶和華見證人，以及被列為「不受歡迎」組織的成員。", "與此同時，與納瓦爾尼組織有關的起訴人數在一年內增加了107%，從69人增至143人。被指控資助極端組織的人數則上升了近117%，從77人增至167人。", "人權活動家安娜·卡雷特尼科娃指出，近幾個月來的一大趨勢，在於政治壓迫的性質發生了變化。", "她指出，雖然過去有相當比例的刑事案件涉及公開言論（包括網路上的言論），但執法機關如今越來越多地針對那些被當局解讀為支持或參與「被禁」組織的人士採取行動。", "卡雷特尼科娃向美國之音俄語部表示：「關注焦點正轉向那些雖未公開抗議，但以各種方式表達異議，或是在衝突中支持他們認為正確的一方的人。」", "據卡雷特尼科娃表示，此類活動可能包括經營聊天群組、提供出版素材，或對相關組織提供資金支持。", "「政治犯支援紀念中心」的報告指出，涉及向納瓦爾尼創立的「反腐敗基金會」（FBK）匯款的案件數量，已出現特別顯著的增長；該基金會已被俄羅斯當局列為「極端主義組織」。", "與此同時，因公開言論而遭受迫害的案件總數在過去一年中下降了 22%。 然而，其他類型的案件卻有所增加，例如涉及鼓吹極端主義的案件數量。此類案件上升了26%，而依據危害國家安全相關條文提起的案件則增加了13%。", "卡雷特尼科娃指出，那些過去未曾被視為政治活動人士的人，正日益成為刑事起訴的目標。她將此歸因於：隨著俄羅斯當局最知名的反對者們或被監禁、或離開該國，鎮壓機器開始擴大潛在目標的範圍。", "「這包括拖拉機駕駛、教師、鄉村醫生——任何人，」卡雷特尼科娃表示。", "該報告的作者們還指出，聯邦安全局（FSB）在政治起訴中的角色顯著增強。在67%的政治動機刑事案件中，至少有一項指控屬於聯邦安全局的調查管轄範圍。"], "zh_for": "https://www.voanews.com/a/human-rights-group-repression-intensifies-in-russia-for-participation-in-undesirable-organizations/8209652.html", "date": "2026-10-12"};
const main = document.getElementById('main');
document.getElementById('meta').textContent = A.date + ' | ' + A.source + ' | ' + A.paras.length + ' 段 · 約 ' + A.words + ' 字';
function wrap(t){ return t.replace(/[A-Za-z][A-Za-z'’-]*/g, m => '<span class="w">'+m+'</span>'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let h = '<h1>'+wrap(esc(A.title))+'</h1><p class="zh">'+esc(A.zh[0]||'')+'</p>';
A.paras.forEach((p,i)=>{ h += '<p class="en" id="p'+i+'"><button class="pl" data-i="'+i+'">▶</button>'+wrap(esc(p))+'</p><p class="zh">'+esc(A.zh[i+1]||'')+'</p>'; });
main.innerHTML = h;
let fs = +localStorage.fs || 18; const setFs=()=>{main.style.setProperty('--fs',fs+'px');localStorage.fs=fs};
setFs();
if(localStorage.hz==='1') main.classList.add('hide-zh');
bz.onclick=()=>{main.classList.toggle('hide-zh');localStorage.hz=main.classList.contains('hide-zh')?'1':'0'};
bm.onclick=()=>{fs=Math.max(13,fs-1);setFs()}; bp.onclick=()=>{fs=Math.min(30,fs+1);setFs()};
bo.onclick=()=>window.open(A.link,'_blank');
// ---- 朗讀(用手機內建的語音,不需要網路與金鑰)----
const synth = window.speechSynthesis; let voice=null, playing=false, token=0;
function pickVoice(){ const v=(synth&&synth.getVoices())||[]; voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|natural|enhanced/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function say(text,done){ if(!synth){alert('這個瀏覽器不支援朗讀');return;} const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=+document.getElementById('rate').value; u.onend=done||null; u.onerror=done||null; synth.speak(u); }
function stopAll(){ token++; playing=false; if(synth) synth.cancel(); ba.textContent='▶ 全文朗讀'; document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); }
function playFrom(i){ stopAll(); const my=token; playing=true; ba.textContent='⏹ 停止';
  (function next(k){ if(my!==token||k>=A.paras.length){ if(my===token) stopAll(); return; }
    const el=document.getElementById('p'+k); document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'});
    say(A.paras[k],()=>{ if(my===token) next(k+1); }); })(i); }
ba.onclick=()=>{ playing?stopAll():playFrom(0); };
main.addEventListener('click',e=>{ const b=e.target.closest('.pl'); if(b){ playFrom(+b.dataset.i); } });
document.getElementById('sp').onclick=()=>{ stopAll(); say(word.textContent); };
window.addEventListener('pagehide',stopAll);
const sheet=document.getElementById('sheet');
document.getElementById('cl').onclick=e=>{e.preventDefault();sheet.classList.remove('open')};
main.addEventListener('click', async e=>{
  const el=e.target.closest('.w'); if(!el) return;
  const w=el.textContent.replace(/[’]/g,"'"); const lw=w.toLowerCase();
  word.textContent=w; tr.textContent='查詢中…';
  cam.href='https://dictionary.cambridge.org/dictionary/english-chinese-traditional/'+encodeURIComponent(lw);
  gt.href='https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text='+encodeURIComponent(w);
  sheet.classList.add('open');
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(lw)+'&langpair=en|zh-TW');
    const j=await r.json(); tr.textContent=(j.responseData&&j.responseData.translatedText)||'(查不到,請點劍橋字典)';
  }catch(_){ tr.textContent='(查詢失敗,請點劍橋字典)'; }
});
</script></body></html>
