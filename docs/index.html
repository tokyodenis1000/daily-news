<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Daily News</title>
<style>
:root{--bg:#1e1e2e;--panel:#2a2a3c;--fg:#e6e6e6;--accent:#7aa2f7;--zh:#8fa1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid #333;z-index:5}
#meta{color:var(--accent);font-size:13px;font-weight:bold;margin-bottom:8px}
.bar button{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px 12px;margin-right:6px;font-size:14px}
main{padding:14px;max-width:760px;margin:auto;font-size:var(--fs,18px)}
h1{font-size:1.35em;margin:.2em 0}
.en{margin:0 0 .4em}
.zh{color:var(--zh);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.93em;margin:0 0 1.4em}
.hide-zh .zh{display:none}
.w{border-radius:3px}
.pl{background:var(--panel);color:var(--accent);border:0;border-radius:50%;width:1.7em;height:1.7em;margin-right:.5em;font-size:.8em;vertical-align:middle}
.playing{background:#2f3350;border-radius:6px}
.bar select{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px;font-size:14px}
.w:active{background:#3b4261}
.w.sv{background:#3b4261;text-decoration:underline}
#sv{background:var(--accent);color:#000;border:0;border-radius:6px;padding:8px 12px;margin:0 10px 10px 0;font-size:14px}
#vp{position:fixed;inset:0;background:var(--bg);z-index:20;overflow:auto;padding:14px;display:none}
#vp.open{display:block}
#vp .bar{margin-bottom:12px}
.vi{background:var(--panel);border-radius:8px;padding:10px 12px;margin:0 0 10px;font-size:16px}
.vi b{color:var(--accent);font-size:1.1em}
.vi small{display:block;color:#9aa5ce;margin-top:4px;font-size:13px}
.vi .del{float:right;background:#3b4261;color:var(--fg);border:0;border-radius:6px;padding:4px 8px}
#qz{text-align:center;padding-top:30px}
#qn{color:var(--accent);font-weight:bold}
#qw{font-size:34px;font-weight:bold;margin:24px 0 8px}
#qa{font-size:22px;color:#c0caf5;min-height:1.4em;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}
#qs{color:#9aa5ce;margin:14px 0 24px;min-height:3em}
#qb{background:var(--panel);color:var(--fg);border:0;border-radius:8px;padding:12px 28px;font-size:17px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:14px 16px 20px;
 border-top:2px solid var(--accent);transform:translateY(110%);transition:.2s;z-index:10}
#sheet.open{transform:none}
#sheet b{font-size:20px}
#sheet a{color:var(--accent);margin-right:14px}
#tr{margin:6px 0 10px;min-height:1.4em;color:#cfd6f5}
</style></head>
<body>
<header><div id="meta"></div>
<div class="bar"><button id="bz">中文 顯示/隱藏</button><button id="bm">A−</button><button id="bp">A+</button>
<button id="bo">原文</button><button id="bv">★ 生字本</button>
<button id="ba">▶ 全文朗讀</button><select id="rate"><option value="0.7">慢</option><option value="0.85" selected>中</option><option value="1">正常</option></select></div></header>
<main id="main"></main>
<div id="sheet"><b id="word"></b> <button class="pl" id="sp">🔊</button><div id="tr"></div>
<button id="sv">★ 加入生字本</button>
<a id="cam" target="_blank">劍橋字典</a><a id="gt" target="_blank">Google 翻譯</a><a href="#" id="cl">關閉</a></div>
<div id="vp"><div class="bar"><button id="vx">← 返回文章</button><button id="vq">開始測驗</button><button id="ve">匯出 CSV</button></div>
<div id="vl"></div>
<div id="qz"><div id="qn"></div><div id="qw"></div><div id="qa"></div><div id="qs"></div><button id="qb">顯示答案</button></div></div>
<script>
const A = {"source": "VOA News", "title": "US condemns Hong Kong Court’s sentencing of pro-democracy activist Joshua Wong", "link": "https://www.voanews.com/a/us-condemns-hong-kong-courts-sentencing-of-pro-democracy-activist-joshua-wong-20261106/8219799.html", "paras": ["Editor's note: This story was translated from the original VOA Mandarin article.", "The United States is condemning a Hong Kong's court decision to sentence activist Joshua Wong to 10 more years in prison on Thursday on charges of \"conspiring to collude with foreign forces.\"", "In a statement on social media platform X, U.S. Secretary of State Marco Rubio said Friday the U.S. \"strongly condemns the Hong Kong Court’s decision to once again sentence Joshua Wong for exercising his freedom of speech. He has used peaceful means to defend the rights promised to all individuals in Hong Kong.\"", "Rubio called \"for his immediate release and that of all unjustly detained persons.\"", "Wong had been serving a 56-month sentence for subversion and was due to be released in January. He had pleaded guilty in both the subversion and collusion cases, which were brought under the National Security Law (NSL) enacted in 2020.", "The court alleged that between July and November 2020, Wong—along with fellow activist Nathan Law and others—\"conspired to request foreign or external entities to impose sanctions, blockades, or engage in other hostile acts against China or the Hong Kong Special Administrative Region.\"", "Following the sentence, Hong Kong Chief Executive John Lee described Wong, Law and others as \"primary culprits responsible for undermining Hong Kong’s prosperity and stability.\"", "In a separate joint statement, nine other countries joined the U.S. in calling for an “immediate end to all unjust prosecutions of individuals” charged under the NSL imposed by Beijing on Hong Kong.", "“These are further examples of how the NSL is being used to target individuals for political expression and participation,\" the governments of the U.S., Australia, Canada, France, Germany, Italy, Japan, the Netherlands, New Zealand, and the UK said in a statement on the sentencing of Wong and recent convictions of other pro-democracy leaders in the city.", "The ten countries call for “an immediate end to all unjust prosecutions of individuals charged under the NSL and urge the authorities in China and Hong Kong to uphold their international commitments and honor the rights and freedoms guaranteed to the people of Hong Kong under the Sino-British Joint Declaration (1984).”", "Now 30, Joshua Wong began his activism when he was 14 and founded the student group Scholarism. He became a leading figure in the 2014 Umbrella Movement protests, for which he later served two short prison terms. He went on to serve as secretary-general of the political party Demosistō. After his release from jail in 2019, Wong joined the city’s massive pro-democracy protests.", "During the months-long protests, Wong participated in efforts to seek international support for Hong Kong’s democracy and autonomy, meeting with Western officials and lawmakers including then U.S. House Speaker Nancy Pelosi. He also testified in a hearing on Capitol Hill.", "Pelosi, a Democratic congresswoman from California, said in a statement on Thursday that “the United States and the international community must demand Joshua’s immediate and unconditional release.”", "John Moolenaar, chairman of the House Select Committee on China, issued a statement on Thursday condemning the sentence as “shameless”.", "\"Joshua Wong is a hero who dared to stand up to an authoritarian superpower,” said the Republican congressman from Michigan.", "“An attempt to erase the voice of our entire generation”", "Eric Lai, a research fellow at the Center for Asian Law at Georgetown University, told VOA that Beijing had long viewed Wong as a \"thorn in its side,\" making the harsh penalty entirely predictable.", "\"From the time Joshua Wong began participating in social movements and Hong Kong’s pro-democracy cause, Beijing identified him as a primary driver of 'anti-China, chaos-inducing' activities in Hong Kong,\" said Lai.", "Ho Leung-mau, a Hong Kong political commentator now based in Canada, noted the latest collusion-related sentence is meant to sever the ties between the city’s protest community and the outside world. He said that the move serves as a political deterrent to others while effectively ending Wong’s political career, ensuring he spends his entire youth behind bars.", "\"Because this is a political prosecution, the authorities had already set a target for how long they wanted to keep Joshua Wong imprisoned,\" Ho told VOA.", "Frances Hui, a former member of Scholarism who now lives in the United States, also believes that the heavy sentence meted out against Wong is clearly an act of political retaliation.", "\"Joshua Wong represents a generation that believes Hong Kong’s future belongs to the Hong Kong people—he embodies the voices, ideas, and visions of the younger generation,\" she told VOA. \"This sentencing is an attempt to erase the voice of our entire generation.\"", "Nathan Law, who now lives in United Kingdom, reminded people in a X post on Thursday to support “my friend Joshua Wong.\"", "“I wish I could see him as soon as possible,” Law wrote in the post."], "words": 795, "zh": ["美國譴責香港法院對民主活動人士黃之鋒的判刑", "編者註：本文翻譯自美國之音（VOA）的原文（普通話版）。", "美國譴責香港法院週四以「串謀勾結外國勢力」的罪名，判處活動人士黃之鋒再入獄10年的裁決。", "美國國務卿馬可·魯比奧週五在社交媒體平台X上發表聲明表示，美國「強烈譴責香港法院再次以行使言論自由為由判處黃之鋒有罪的決定。他是以和平手段捍衛香港所有市民應享的權利。」", "魯比奧呼籲「立即釋放他以及所有遭不公正拘留的人士」。", "黃某因顛覆罪正在服刑56個月，原定於1月獲釋。他曾在顛覆案及勾結案中均認罪，這兩起案件均是依據2020年頒布的《國家安全法》（NSL）提起的。", "法院指控，在2020年7月至11月期間，黃某與同為活動人士的羅冠賢等人「串謀要求外國或境外實體對中國或香港特別行政區實施制裁、封鎖或採取其他敵對行動」。", "判決宣讀後，香港行政長官李家超將黃、羅等人形容為「破壞香港繁榮與穩定的主要元兇」。", "在另一份聯合聲明中，另有九個國家與美國共同呼籲「立即停止對所有根據北京當局強加於香港的《國家安全法》而被起訴的個人進行不公正的起訴」。", "“「這些是《國家安全法》如何被用來針對因政治言論及參與活動的個人的進一步例證，」美國、澳洲、加拿大、法國、德國、義大利、日本、荷蘭、紐西蘭及英國政府就黃之鋒的判刑，以及近期該市其他民主派領袖被定罪一事，在聲明中表示。", "這十個國家呼籲「立即終止所有根據《國家安全法》對個人提出的不公正起訴，並敦促中國及香港當局恪守其國際承諾，尊重《中英聯合聲明》（1984年）所保障的香港市民權利與自由。」", "現年30歲的黃之鋒，14歲時便開始投身社會運動，並創立了學生團體「學民思潮」。他成為2014年「雨傘運動」抗議活動的領軍人物，並因此事後來兩度短暫入獄。 此後，他出任政治黨派「香港民主主義者」的秘書長。2019年出獄後，黃之鋒加入了香港大規模的民主抗議活動。", "在為期數個月的抗議活動期間，黃先生積極參與爭取國際社會對香港民主與自治的支持，並會見了包括時任美國眾議院議長南希·佩洛西在內的西方官員及立法者。他還曾在國會山莊的一場聽證會上作證。", "來自加州、隸屬民主黨的國會女議員佩洛西週四在一份聲明中表示：「美國和國際社會必須要求立即且無條件釋放約書亞。」", "眾議院中國特別委員會主席約翰·穆勒納爾（John Moolenaar）週四發表聲明，譴責該判決「無恥」。", "「黃之鋒是一位敢於挺身對抗威權超級大國的英雄，」這位來自密西根州的共和黨國會議員表示。", "「這是一場企圖抹去我們整整一代人聲音的行動」", "喬治城大學亞洲法律中心研究員賴艾瑞克（Eric Lai）向美國之音表示，北京方面長期以來一直將黃某視為「眼中釘」，因此這項嚴厲的刑罰完全在預料之中。", "「自黃之鋒開始參與社會運動及香港的民主運動以來，北京方面便將他視為香港『反中、煽動動亂』活動的主要推手，」黎表示。", "現居加拿大的香港政治評論員何良茂指出，這項與「勾結」指控相關的最新判決，旨在切斷香港抗議群體與外界的聯繫。他表示，此舉既對其他人起到政治威懾作用，同時也實際上終結了黃某的政治生涯，確保他將在獄中度過整個青春歲月。", "何先生向美國之音表示：「由於這是一場政治迫害，當局早已設定了希望將黃之鋒關押多久的目標。」", "現居美國的「學民思潮」前成員許慧，亦認為黃某所獲的重判顯然是政治報復的行為。", "「黃之鋒代表了一代相信香港的未來屬於香港人的年輕人——他體現了年輕一代的聲音、想法和願景，」她對美國之音表示。「這次判刑是企圖抹殺我們整整一代人的聲音。」", "現居英國的內森·勞（Nathan Law）週四在 X 平台發文，呼籲大家支持「我的朋友黃之鋒」。", "「真希望我能盡快見到他，」勞在貼文中寫道。"], "zh_for": "https://www.voanews.com/a/us-condemns-hong-kong-courts-sentencing-of-pro-democracy-activist-joshua-wong-20261106/8219799.html", "date": "2026-11-06"};
const main = document.getElementById('main');
document.getElementById('meta').textContent = A.date + ' | ' + A.source + ' | ' + A.paras.length + ' 段 · 約 ' + A.words + ' 字';
function wrap(t){ return t.replace(/[A-Za-z][A-Za-z'’-]*/g, m => '<span class="w">'+m+'</span>'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let h = '<h1>'+wrap(esc(A.title))+'</h1><p class="zh">'+esc(A.zh[0]||'')+'</p>';
A.paras.forEach((p,i)=>{ h += '<p class="en" id="p'+i+'"><button class="pl" data-i="'+i+'">▶</button>'+wrap(esc(p))+'</p><p class="zh">'+esc(A.zh[i+1]||'')+'</p>'; });
main.innerHTML = h;
let fs = +localStorage.fs || 18; const setFs=()=>{main.style.setProperty('--fs',fs+'px');localStorage.fs=fs};
setFs();
if(localStorage.hz==='1') main.classList.add('hide-zh');
bz.onclick=()=>{main.classList.toggle('hide-zh');localStorage.hz=main.classList.contains('hide-zh')?'1':'0'};
bm.onclick=()=>{fs=Math.max(13,fs-1);setFs()}; bp.onclick=()=>{fs=Math.min(30,fs+1);setFs()};
bo.onclick=()=>window.open(A.link,'_blank');
// ---- 朗讀(用手機內建的語音,不需要網路與金鑰)----
const synth = window.speechSynthesis; let voice=null, playing=false, token=0;
function pickVoice(){ const v=(synth&&synth.getVoices())||[]; voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|natural|enhanced/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function say(text,done){ if(!synth){alert('這個瀏覽器不支援朗讀');return;} const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=+document.getElementById('rate').value; u.onend=done||null; u.onerror=done||null; synth.speak(u); }
function stopAll(){ token++; playing=false; if(synth) synth.cancel(); ba.textContent='▶ 全文朗讀'; document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); }
function playFrom(i){ stopAll(); const my=token; playing=true; ba.textContent='⏹ 停止';
  (function next(k){ if(my!==token||k>=A.paras.length){ if(my===token) stopAll(); return; }
    const el=document.getElementById('p'+k); document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'});
    say(A.paras[k],()=>{ if(my===token) next(k+1); }); })(i); }
ba.onclick=()=>{ playing?stopAll():playFrom(0); };
main.addEventListener('click',e=>{ const b=e.target.closest('.pl'); if(b){ playFrom(+b.dataset.i); } });
document.getElementById('sp').onclick=()=>{ stopAll(); say(word.textContent); };
window.addEventListener('pagehide',stopAll);
// ---- 生字本(存在這支手機的瀏覽器裡;清除瀏覽器資料會一起消失,可先匯出 CSV 備份)----
let V=[]; try{V=JSON.parse(localStorage.vocab||'[]')}catch(_){V=[]}
const saveV=()=>{try{localStorage.vocab=JSON.stringify(V)}catch(_){}};
const hasV=w=>V.some(v=>v.word.toLowerCase()===w.toLowerCase());
function markV(){ const s=new Set(V.map(v=>v.word.toLowerCase())); document.querySelectorAll('.w').forEach(e=>e.classList.toggle('sv',s.has(e.textContent.replace(/[’]/g,"'").toLowerCase()))); }
function sentenceOf(el){ const p=el.closest('p,h1'); if(!p) return ''; const t=p.textContent.replace(/^▶/,'').trim(); for(const s of t.split(/(?<=[.!?])\s+/)){ if(s.includes(el.textContent)) return s.trim(); } return t; }
let cur=null;
markV();
sv.onclick=()=>{ if(!cur||hasV(cur.word)) return; V.push({word:cur.word,zh:cur.zh||'',sentence:cur.sentence,source:A.source,title:A.title,date:A.date}); saveV(); markV(); sv.textContent='已加入 ✓'; };
function renderV(){ qz.style.display='none'; vl.style.display='block';
  vl.innerHTML=V.length?V.slice().reverse().map(v=>'<div class="vi"><button class="del" data-w="'+esc(v.word)+'">刪除</button><b>'+esc(v.word)+'</b> '+esc(v.zh||'')+'<small>'+esc(v.sentence||'')+'</small></div>').join(''):'<p>還沒有生字。點文章裡的單字,再按「★ 加入生字本」。</p>'; }
vl.addEventListener('click',e=>{ const b=e.target.closest('.del'); if(!b) return; V=V.filter(v=>v.word!==b.dataset.w); saveV(); markV(); renderV(); });
bv.onclick=()=>{ stopAll(); renderV(); vp.classList.add('open'); };
vx.onclick=()=>vp.classList.remove('open');
let Q=[],qi=0,qshown=false;
function qrender(){ qshown=false; qn.textContent=(qi+1)+'/'+Q.length; qw.textContent=Q[qi].word; qa.textContent=''; qs.textContent=''; qb.textContent='顯示答案'; }
vq.onclick=()=>{ if(!V.length) return; Q=V.slice().sort(()=>Math.random()-.5); qi=0; vl.style.display='none'; qz.style.display='block'; qrender(); };
qb.onclick=()=>{
  if(qi>=Q.length){ renderV(); return; }
  if(!qshown){ qa.textContent=Q[qi].zh||'(沒有翻譯)'; qs.textContent=Q[qi].sentence||''; qshown=true; qb.textContent=qi+1<Q.length?'下一個':'完成'; }
  else if(qi+1<Q.length){ qi++; qrender(); }
  else { qi=Q.length; qn.textContent='完成!'; qw.textContent='複習完了'; qa.textContent=''; qs.textContent=''; qb.textContent='回到清單'; }
};
ve.onclick=()=>{ const rows=[['單字','中文','例句','文章來源','文章標題','日期']].concat(V.map(v=>[v.word,v.zh,v.sentence,v.source,v.title,v.date]));
  const csv='\ufeff'+rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download='vocab.csv'; a.click(); };

const sheet=document.getElementById('sheet');
document.getElementById('cl').onclick=e=>{e.preventDefault();sheet.classList.remove('open')};
main.addEventListener('click', async e=>{
  const el=e.target.closest('.w'); if(!el) return;
  const w=el.textContent.replace(/[’]/g,"'"); const lw=w.toLowerCase();
  word.textContent=w; tr.textContent='查詢中…';
cur={word:w,zh:'',sentence:sentenceOf(el)}; sv.textContent=hasV(w)?'已加入 ✓':'★ 加入生字本';
  cam.href='https://dictionary.cambridge.org/dictionary/english-chinese-traditional/'+encodeURIComponent(lw);
  gt.href='https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text='+encodeURIComponent(w);
  sheet.classList.add('open');
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(lw)+'&langpair=en|zh-TW');
    const j=await r.json(); const t=(j.responseData&&j.responseData.translatedText)||''; tr.textContent=t||'(查不到,請點劍橋字典)';
if(cur&&cur.word===w) cur.zh=t;
const ex=V.find(v=>v.word.toLowerCase()===lw); if(ex&&!ex.zh&&t){ ex.zh=t; saveV(); }
  }catch(_){ tr.textContent='(查詢失敗,請點劍橋字典)'; }
});
</script></body></html>
