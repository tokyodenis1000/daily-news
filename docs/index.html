<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Daily News</title>
<style>
:root{--bg:#1e1e2e;--panel:#2a2a3c;--fg:#e6e6e6;--accent:#7aa2f7;--zh:#8fa1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid #333;z-index:5}
#meta{color:var(--accent);font-size:13px;font-weight:bold;margin-bottom:8px}
.bar button{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px 12px;margin-right:6px;font-size:14px}
main{padding:14px;max-width:760px;margin:auto;font-size:var(--fs,18px)}
h1{font-size:1.35em;margin:.2em 0}
.en{margin:0 0 .4em}
.zh{color:var(--zh);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.93em;margin:0 0 1.4em}
.hide-zh .zh{display:none}
.w{border-radius:3px}
.pl{background:var(--panel);color:var(--accent);border:0;border-radius:50%;width:1.7em;height:1.7em;margin-right:.5em;font-size:.8em;vertical-align:middle}
.playing{background:#2f3350;border-radius:6px}
.bar select{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px;font-size:14px}
.w:active{background:#3b4261}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:14px 16px 20px;
 border-top:2px solid var(--accent);transform:translateY(110%);transition:.2s;z-index:10}
#sheet.open{transform:none}
#sheet b{font-size:20px}
#sheet a{color:var(--accent);margin-right:14px}
#tr{margin:6px 0 10px;min-height:1.4em;color:#cfd6f5}
</style></head>
<body>
<header><div id="meta"></div>
<div class="bar"><button id="bz">中文 顯示/隱藏</button><button id="bm">A−</button><button id="bp">A+</button>
<button id="bo">原文</button>
<button id="ba">▶ 全文朗讀</button><select id="rate"><option value="0.7">慢</option><option value="0.85" selected>中</option><option value="1">正常</option></select></div></header>
<main id="main"></main>
<div id="sheet"><b id="word"></b> <button class="pl" id="sp">🔊</button><div id="tr"></div>
<a id="cam" target="_blank">劍橋字典</a><a id="gt" target="_blank">Google 翻譯</a><a href="#" id="cl">關閉</a></div>
<script>
const A = {"source": "VOA News", "title": "Journalist Michael Nacke Rejects Criminal Cases Against Him as Unlawful", "link": "https://www.voanews.com/a/journalist-michael-nacke-rejects-criminal-cases-against-him-as-unlawful/8211316.html", "paras": ["Editor's note: this story was translated from the original VOA Russian article.", "Journalist and popular YouTube host Michael Macke, a dual U.S. and Russian citizen, has rejected recent criminal proceedings against him by Russia in absentia as unlawful, in an interview with VOA.", "Nacke, also known as Michael Naki, is the host of “Popular Politics\" and “MackNack” YouTube. Despite living outside of Russia, he is on a Russian government \"wanted list.\"", "On Tuesday, Moscow’s Basmanny District Court handed Nacke a second – in absentia conviction. He was found guilty of publicly calling for “actions against the security of the Russian Federation, committed via the internet.” The court sentenced him to five years in prison.", "The criminal case stemmed from a video published on the journalist’s YouTube channel on May 7, 2024. Prosecutors alleged that the video contained calls for actions against Russian state security.", "Commenting on the new sentence in an interview with VOA Russian, Nacke said he did not consider the criminal proceedings against him legitimate.", "“As for the legal side of things – all these criminal cases and everything else – I don’t take them particularly seriously. I don’t really understand why other people do. I consider them unlawful. I believe these trials, based on fabricated charges that have no legitimate basis, contradict the Russian constitution, the law that has direct applicability,” he said.", "However, Nacke said that court rulings were not his primary concern. He was more worried about the activities of Russian security services.", "“It was clear that there would be prison sentences and so on. Basically, the only thing that worries me is the activity of the Russian security services. It’s not just about court rulings; it’s about the fact that they kill people and hunt them down,\" he said. “And I’m most likely on some list of people they want to target. That concerns me much more.\"", "During in absentia court proceedings he was represented by a court-appointed lawyer. However, Nacke said, this lawyer had not gotten in contact with him, even though she declared his innocence during the hearing.", "“I read in the news that she – and I greatly appreciate it – said I was guilty of nothing and pointed out that she had no contact with me. That’s obviously disappointing; she could have reached out. You managed to find a way to contact me, after all. I think she could have found a way, too, if she had tried,” he said.", "The defense lawyer had asked the court to acquit him. Russian authorities have placed Nacke on a wanted list and ordered his arrest in absentia.", "Nacke said the proceedings would not change his work.", "“In the end, I have neither plans nor intention to adjust my work in any way to accommodate their fabricated sentences,” he said.", "Nacke left Russia in the summer of 2021. In September 2022, Russia’s Justice Ministry added him to its register of “foreign agents.”", "In August 2023, Nacke and Ruslan Leviev, founder of the Conflict Intelligence Team, were sentenced in absentia to 11 years in prison in a case involving the dissemination of what Russian authorities described as “false information” about the Russian military.", "Nacke previously worked as a presenter and commentator for the Echo of Moscow radio station. Since leaving Russia, he has focused on developing his own YouTube channel, where he publishes coverage and analysis of Russian politics and the war in Ukraine."], "words": 570, "zh": ["記者麥可·納克駁回針對他的刑事指控，稱其違法", "編者註：本報導翻譯自美國之音（VOA）俄語原文。", "擁有美國與俄羅斯雙重國籍的記者兼人氣YouTube主持人麥可·麥基（Michael Macke），在接受美國之音（VOA）採訪時，駁斥俄羅斯近期針對他進行的缺席刑事訴訟屬違法行為。", "納克（Nacke），又名麥可·納基（Michael Naki），是 YouTube 頻道《流行政治》（Popular Politics）與《MackNack》的主持人。儘管他居住在俄羅斯境外，卻仍被列入俄羅斯政府的「通緝名單」。", "週二，莫斯科巴斯曼尼區法院對納克作出第二項缺席判決。他被認定犯有「透過網路公開煽動危害俄羅斯聯邦安全的行為」之罪。法院判處他五年有期徒刑。", "這起刑事案件源於該名記者於2024年5月7日發布在其YouTube頻道上的一段影片。檢方指控該影片包含煽動針對俄羅斯國家安全採取行動的內容。", "在接受美國之音俄語頻道採訪時，納克就這項新判決發表評論，表示他不認為針對他的刑事訴訟是合法的。", "「至於法律層面的事情——所有這些刑事案件及其他相關事宜——我並未特別重視。 我實在不明白為什麼其他人會這麼做。我認為這些行為是非法的。我認為這些審判是基於毫無合法依據的捏造指控，這與《俄羅斯憲法》以及直接適用的法律相牴觸，」他說道。", "然而，納克表示，法院的裁決並非他最關心的問題。他更擔心的是俄羅斯安全機構的活動。", "「很明顯，將會面臨監禁等處罰。基本上，唯一讓我擔憂的是俄羅斯安全部門的行動。這不僅僅是法院判決的問題；關鍵在於他們會殺人並追捕人，」他說。 「而且我極有可能被列入他們鎖定的目標名單中。這點更讓我感到擔憂。」", "在缺席審理期間，他由一名法院指派的律師代理。然而，納克表示，儘管該律師在聽證會上聲稱他無罪，卻從未與他聯繫過。", "「我從新聞上看到，她——對此我深表感激——表示我並無罪責，並指出她與我並無聯繫。這顯然令人失望；她本可以主動聯繫我的。畢竟，你總算還是找到辦法聯繫到我了。 我認為，如果她願意試試，應該也能找到方法的，」他說道。", "辯護律師曾向法院請求判其無罪。俄羅斯當局已將納克列入通緝名單，並下令對其進行缺席逮捕。", "納克表示，這場訴訟不會影響他的工作。", "「歸根結底，我既沒有計畫，也沒有意圖以任何方式調整我的作品，來迎合他們捏造的句子，」他說道。", "納克於 2021 年夏天離開俄羅斯。2022 年 9 月，俄羅斯司法部將他列入「外國代理人」名冊。", "2023年8月，納克（Nacke）與「衝突情報小組」（Conflict Intelligence Team）創辦人魯斯蘭·列維耶夫（Ruslan Leviev），在一宗涉及散佈俄羅斯當局所稱關於俄羅斯軍方的「虛假資訊」的案件中，被缺席判處11年有期徒刑。", "納克此前曾在「莫斯科回聲」廣播電台擔任主持人與評論員。自離開俄羅斯以來，他一直致力於經營自己的 YouTube 頻道，並在該頻道上發布關於俄羅斯政治及烏克蘭戰爭的報導與分析。"], "zh_for": "https://www.voanews.com/a/journalist-michael-nacke-rejects-criminal-cases-against-him-as-unlawful/8211316.html", "date": "2026-10-14"};
const main = document.getElementById('main');
document.getElementById('meta').textContent = A.date + ' | ' + A.source + ' | ' + A.paras.length + ' 段 · 約 ' + A.words + ' 字';
function wrap(t){ return t.replace(/[A-Za-z][A-Za-z'’-]*/g, m => '<span class="w">'+m+'</span>'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let h = '<h1>'+wrap(esc(A.title))+'</h1><p class="zh">'+esc(A.zh[0]||'')+'</p>';
A.paras.forEach((p,i)=>{ h += '<p class="en" id="p'+i+'"><button class="pl" data-i="'+i+'">▶</button>'+wrap(esc(p))+'</p><p class="zh">'+esc(A.zh[i+1]||'')+'</p>'; });
main.innerHTML = h;
let fs = +localStorage.fs || 18; const setFs=()=>{main.style.setProperty('--fs',fs+'px');localStorage.fs=fs};
setFs();
if(localStorage.hz==='1') main.classList.add('hide-zh');
bz.onclick=()=>{main.classList.toggle('hide-zh');localStorage.hz=main.classList.contains('hide-zh')?'1':'0'};
bm.onclick=()=>{fs=Math.max(13,fs-1);setFs()}; bp.onclick=()=>{fs=Math.min(30,fs+1);setFs()};
bo.onclick=()=>window.open(A.link,'_blank');
// ---- 朗讀(用手機內建的語音,不需要網路與金鑰)----
const synth = window.speechSynthesis; let voice=null, playing=false, token=0;
function pickVoice(){ const v=(synth&&synth.getVoices())||[]; voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|natural|enhanced/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function say(text,done){ if(!synth){alert('這個瀏覽器不支援朗讀');return;} const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=+document.getElementById('rate').value; u.onend=done||null; u.onerror=done||null; synth.speak(u); }
function stopAll(){ token++; playing=false; if(synth) synth.cancel(); ba.textContent='▶ 全文朗讀'; document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); }
function playFrom(i){ stopAll(); const my=token; playing=true; ba.textContent='⏹ 停止';
  (function next(k){ if(my!==token||k>=A.paras.length){ if(my===token) stopAll(); return; }
    const el=document.getElementById('p'+k); document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'});
    say(A.paras[k],()=>{ if(my===token) next(k+1); }); })(i); }
ba.onclick=()=>{ playing?stopAll():playFrom(0); };
main.addEventListener('click',e=>{ const b=e.target.closest('.pl'); if(b){ playFrom(+b.dataset.i); } });
document.getElementById('sp').onclick=()=>{ stopAll(); say(word.textContent); };
window.addEventListener('pagehide',stopAll);
const sheet=document.getElementById('sheet');
document.getElementById('cl').onclick=e=>{e.preventDefault();sheet.classList.remove('open')};
main.addEventListener('click', async e=>{
  const el=e.target.closest('.w'); if(!el) return;
  const w=el.textContent.replace(/[’]/g,"'"); const lw=w.toLowerCase();
  word.textContent=w; tr.textContent='查詢中…';
  cam.href='https://dictionary.cambridge.org/dictionary/english-chinese-traditional/'+encodeURIComponent(lw);
  gt.href='https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text='+encodeURIComponent(w);
  sheet.classList.add('open');
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(lw)+'&langpair=en|zh-TW');
    const j=await r.json(); tr.textContent=(j.responseData&&j.responseData.translatedText)||'(查不到,請點劍橋字典)';
  }catch(_){ tr.textContent='(查詢失敗,請點劍橋字典)'; }
});
</script></body></html>
