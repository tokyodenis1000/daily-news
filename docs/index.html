<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1e1e2e">
<title>Daily News</title>
<style>
:root{--bg:#1e1e2e;--panel:#2a2a3c;--fg:#e6e6e6;--accent:#7aa2f7;--zh:#8fa1d6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:Arial,sans-serif;line-height:1.55}
header{position:sticky;top:0;background:var(--bg);padding:10px 14px;border-bottom:1px solid #333;z-index:5}
#meta{color:var(--accent);font-size:13px;font-weight:bold;margin-bottom:8px}
.bar button{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px 12px;margin-right:6px;font-size:14px}
main{padding:14px;max-width:760px;margin:auto;font-size:var(--fs,18px)}
h1{font-size:1.35em;margin:.2em 0}
.en{margin:0 0 .4em}
.zh{color:var(--zh);font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;font-size:.93em;margin:0 0 1.4em}
.hide-zh .zh{display:none}
.w{border-radius:3px}
.pl{background:var(--panel);color:var(--accent);border:0;border-radius:50%;width:1.7em;height:1.7em;margin-right:.5em;font-size:.8em;vertical-align:middle}
.playing{background:#2f3350;border-radius:6px}
.bar select{background:var(--panel);color:var(--fg);border:0;border-radius:6px;padding:8px;font-size:14px}
.w:active{background:#3b4261}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);padding:14px 16px 20px;
 border-top:2px solid var(--accent);transform:translateY(110%);transition:.2s;z-index:10}
#sheet.open{transform:none}
#sheet b{font-size:20px}
#sheet a{color:var(--accent);margin-right:14px}
#tr{margin:6px 0 10px;min-height:1.4em;color:#cfd6f5}
</style></head>
<body>
<header><div id="meta"></div>
<div class="bar"><button id="bz">中文 顯示/隱藏</button><button id="bm">A−</button><button id="bp">A+</button>
<button id="bo">原文</button>
<button id="ba">▶ 全文朗讀</button><select id="rate"><option value="0.7">慢</option><option value="0.85" selected>中</option><option value="1">正常</option></select></div></header>
<main id="main"></main>
<div id="sheet"><b id="word"></b> <button class="pl" id="sp">🔊</button><div id="tr"></div>
<a id="cam" target="_blank">劍橋字典</a><a id="gt" target="_blank">Google 翻譯</a><a href="#" id="cl">關閉</a></div>
<script>
const A = {"source": "VOA News", "title": "Iran government spokesperson confirms internet slowdown in the country", "link": "https://www.voanews.com/a/iran-government-spokesperson-confirms-internet-slowdown-in-the-country/8210846.html", "paras": ["Editor's note: this story was translated from the original VOA Persian article.", "An Iranian government spokesperson on Tuesday confirmed a slowdown of internet connectivity in the country, saying \"certain government agencies are occasionally compelled to reduce internet connectivity speed.\"", "In recent weeks, users and various media outlets in Iran have repeatedly reported a noticeable slowdown in internet connections. VOA has also in the past reported some of the disruption.", "At her weekly press conference Tuesday, government spokesperson Fatemeh Mohajerani, said the decision to slow down connectivity is due to wartime conditions.", "Iran cut off access to the global internet when the conflict with the United States and Israel started at the end of February.", "This outage lasted 88 days and over 2,000 hours. NetBlocks, a global internet watchdog, said it was the longest recorded nationwide internet blackout in the world. During the outage, NetBlocks reported that Iran's connectivity had dropped to approximately one percent of its pre-war levels.", "On May 26, Iranian President Masoud Pezeshkian ordered Communications Minister Seyyed-Sattar Hashemi to restore Iranian citizens' access to the global internet. The Cyberspace Headquarters, chaired by First Vice President Mohammad-Reza Aref, approved the order, which resulted in the restart of connectivity at speeds prior to anti-government protests.", "The protests began well before the war did; in late December and January of 2025, during which the internet was not entirely shut off, but was severely slowed down and restricted. The total blackout began at the outset of the war in late February 2026.", "Following the Iran’s May order to restore internet services, Deputy Minister of Communications Ehsan Chitsaz said, \"Everyone will be connected to the global internet within the next 24 hours.\" Aref described the government's move as \"the first step toward free and regulated access to cyberspace.”", "Iran’s Court of Administrative Justice halted the implementation of the mandate. Instead, it established the \"Special Committee for Organizing and Managing Cyberspace\" after hearing complaints seeking its annulment.", "Hardline factions and the Islamic Revolutionary Guard Corps (IRGC) also opposed the order to restore internet access, citing \"persistent security threats.\"", "The restoration of access was incomplete, and users remarked that their connection experience fell far short of the government's promises.", "The Iranian government has previously acknowledged that many online businesses could not survive for more than three weeks and that the national economy was suffering direct losses amounting to tens of millions of dollars daily in light of the blackout. Lifting internet restrictions had been a key campaign promise of the Pezeshkian administration."], "words": 417, "zh": ["伊朗政府發言人證實該國網路速度變慢", "編者註：本報導翻譯自美國之音波斯語版原文。", "伊朗政府一名發言人週二證實該國網路連線速度有所減緩，並表示「某些政府機關偶爾被迫降低網路連線速度。」", "近幾週來，伊朗的用戶和各大媒體多次報導，網路連線速度明顯變慢。美國之音（VOA）過去也曾報導過部分此類中斷情況。", "政府發言人法蒂瑪·莫哈傑拉尼（Fatemeh Mohajerani）週二在例行記者會上表示，放緩網路連線速度的決定是基於戰時狀況。", "當二月底與美國及以色列的衝突爆發時，伊朗切斷了與全球網際網路的連線。", "此次網路中斷持續了 88 天，超過 2,000 小時。全球網路監測組織 NetBlocks 表示，這是全球有紀錄以來持續時間最長的全國性網路中斷。NetBlocks 指出，在網路中斷期間，伊朗的網路連通性已降至戰前水準的約 1%。", "5月26日，伊朗總統馬蘇德·佩澤什基安下令通訊部長賽義德-薩塔爾·哈什米恢復伊朗公民接取全球網際網路的權限。 由第一副總統穆罕默德-雷扎·阿雷夫擔任主席的「網路空間總部」批准了這項命令，隨後網路連線速度恢復至反政府抗議活動爆發前的水平。", "抗議活動早在戰爭爆發前便已開始；2025年12月下旬至2026年1月期間，網路雖未完全中斷，但網速嚴重遲緩且受到嚴格限制。全面網路封鎖則始於2026年2月下旬戰爭爆發之初。", "繼伊朗於五月下令恢復網路服務後，通訊部副部長埃赫桑·奇茨阿茲表示：「未來24小時內，所有人將都能連上全球網路。」阿雷夫將政府的這項舉措形容為「邁向自由且受規範的網路空間的第一步」。", "伊朗行政法院暫停了該指令的實施。相反地，在聽取要求撤銷該指令的申訴後，該法院成立了「網路空間組織與管理特別委員會」。", "強硬派勢力與伊斯蘭革命衛隊（IRGC）也以「持續存在的安全威脅」為由，反對恢復網路連線的命令。", "網路服務的恢復並不徹底，使用者表示，他們的連線體驗遠遠不如政府所承諾的那樣。", "伊朗政府此前曾承認，許多網路企業在網路中斷的情況下無法維持營運超過三週，且全國經濟每天因此蒙受數千萬美元的直接損失。解除網路限制一直是佩澤什基安政府的一項重要競選承諾。"], "zh_for": "https://www.voanews.com/a/iran-government-spokesperson-confirms-internet-slowdown-in-the-country/8210846.html", "date": "2026-10-13"};
const main = document.getElementById('main');
document.getElementById('meta').textContent = A.date + ' | ' + A.source + ' | ' + A.paras.length + ' 段 · 約 ' + A.words + ' 字';
function wrap(t){ return t.replace(/[A-Za-z][A-Za-z'’-]*/g, m => '<span class="w">'+m+'</span>'); }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
let h = '<h1>'+wrap(esc(A.title))+'</h1><p class="zh">'+esc(A.zh[0]||'')+'</p>';
A.paras.forEach((p,i)=>{ h += '<p class="en" id="p'+i+'"><button class="pl" data-i="'+i+'">▶</button>'+wrap(esc(p))+'</p><p class="zh">'+esc(A.zh[i+1]||'')+'</p>'; });
main.innerHTML = h;
let fs = +localStorage.fs || 18; const setFs=()=>{main.style.setProperty('--fs',fs+'px');localStorage.fs=fs};
setFs();
if(localStorage.hz==='1') main.classList.add('hide-zh');
bz.onclick=()=>{main.classList.toggle('hide-zh');localStorage.hz=main.classList.contains('hide-zh')?'1':'0'};
bm.onclick=()=>{fs=Math.max(13,fs-1);setFs()}; bp.onclick=()=>{fs=Math.min(30,fs+1);setFs()};
bo.onclick=()=>window.open(A.link,'_blank');
// ---- 朗讀(用手機內建的語音,不需要網路與金鑰)----
const synth = window.speechSynthesis; let voice=null, playing=false, token=0;
function pickVoice(){ const v=(synth&&synth.getVoices())||[]; voice=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|natural|enhanced/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null; }
if(synth){ pickVoice(); synth.onvoiceschanged=pickVoice; }
function say(text,done){ if(!synth){alert('這個瀏覽器不支援朗讀');return;} const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; if(voice) u.voice=voice; u.rate=+document.getElementById('rate').value; u.onend=done||null; u.onerror=done||null; synth.speak(u); }
function stopAll(){ token++; playing=false; if(synth) synth.cancel(); ba.textContent='▶ 全文朗讀'; document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); }
function playFrom(i){ stopAll(); const my=token; playing=true; ba.textContent='⏹ 停止';
  (function next(k){ if(my!==token||k>=A.paras.length){ if(my===token) stopAll(); return; }
    const el=document.getElementById('p'+k); document.querySelectorAll('.playing').forEach(e=>e.classList.remove('playing')); el.classList.add('playing'); el.scrollIntoView({block:'center',behavior:'smooth'});
    say(A.paras[k],()=>{ if(my===token) next(k+1); }); })(i); }
ba.onclick=()=>{ playing?stopAll():playFrom(0); };
main.addEventListener('click',e=>{ const b=e.target.closest('.pl'); if(b){ playFrom(+b.dataset.i); } });
document.getElementById('sp').onclick=()=>{ stopAll(); say(word.textContent); };
window.addEventListener('pagehide',stopAll);
const sheet=document.getElementById('sheet');
document.getElementById('cl').onclick=e=>{e.preventDefault();sheet.classList.remove('open')};
main.addEventListener('click', async e=>{
  const el=e.target.closest('.w'); if(!el) return;
  const w=el.textContent.replace(/[’]/g,"'"); const lw=w.toLowerCase();
  word.textContent=w; tr.textContent='查詢中…';
  cam.href='https://dictionary.cambridge.org/dictionary/english-chinese-traditional/'+encodeURIComponent(lw);
  gt.href='https://translate.google.com/?sl=en&tl=zh-TW&op=translate&text='+encodeURIComponent(w);
  sheet.classList.add('open');
  try{
    const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(lw)+'&langpair=en|zh-TW');
    const j=await r.json(); tr.textContent=(j.responseData&&j.responseData.translatedText)||'(查不到,請點劍橋字典)';
  }catch(_){ tr.textContent='(查詢失敗,請點劍橋字典)'; }
});
</script></body></html>
